<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Дякуємо</title>
  <script defer src="/_vercel/insights/script.js"></script>
  <script>
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8eef2; color: #333; font-family: "Segoe UI", Tahoma, sans-serif; }
    main { width: min(640px, calc(100% - 32px)); padding: 28px 16px 48px; }
    h1 { font-size: 28px; line-height: 1.25; margin: 0 0 16px; }
    p { margin: 8px 0; line-height: 1.5; }
    a { color: #ad1457; }
    #upsell:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <div id="text"></div>
    <div id="upsell"></div>
  </main>
  <script>
    var PIXEL_ID = "1749190629525376";
    function textNode(tag, value) {
      var el = document.createElement(tag);
      el.textContent = value == null ? "" : String(value);
      return el;
    }
    var order = null;
    try { order = JSON.parse(sessionStorage.getItem("dyakuiemo_order") || "null"); } catch (e) { order = null; }
    var box = document.getElementById("text");
    if (!order || !order.order_id || !order.phone || !order.name) {
      var p = document.createElement("p");
      var a = document.createElement("a");
      a.href = "/";
      a.textContent = "На головну";
      p.appendChild(a);
      box.appendChild(textNode("h1", "Дякуємо!"));
      box.appendChild(p);
    } else {
      box.appendChild(textNode("h1", "Дякуємо, " + order.name + "! Замовлення №" + order.order_id + " прийнято"));
      if (order.product) box.appendChild(textNode("p", order.product));
      if (order.variant) box.appendChild(textNode("p", order.variant));
      box.appendChild(textNode("p", "Сума: " + order.total + " грн"));
      box.appendChild(textNode("p", "Менеджер зателефонує найближчим часом для підтвердження. Оплата при отриманні на Новій Пошті."));
      var fn = String(order.name).trim().toLowerCase();
      try {
        fbq("set", "autoConfig", false, PIXEL_ID);
        fbq("init", PIXEL_ID, { ph: String(order.phone), fn: fn });
        fbq("track", "PageView");
      } catch (e1) {}
      var key = "sent_" + order.order_id;
      if (localStorage.getItem(key) !== "1") {
        try {
          fbq("track", "Lead", { value: Number(order.total), currency: "UAH", content_name: order.variant }, { eventID: order.order_id });
          fbq("track", "Purchase", { value: Number(order.total), currency: "UAH", content_name: order.variant }, { eventID: order.order_id });
        } catch (e2) {}
        try {
          if (window.ttq && window.ttq.identify && window.ttq.track) {
            ttq.identify({ phone_number: "+" + order.phone });
            ttq.track("SubmitForm", { value: Number(order.total), currency: "UAH" }, { event_id: order.order_id });
          }
        } catch (e3) {}
        try { localStorage.setItem(key, "1"); } catch (e4) {}
      }
    }
  </script>

</body>
</html>
